<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-label="How Career Strategist differs from a typical career-planning skill">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#123f3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="980" rx="18" fill="#ffffff"/>
  <rect width="1200" height="980" rx="18" fill="none" stroke="#d7e0ea"/>

  <text x="40" y="48" font-family="Georgia,'Iowan Old Style',serif" font-size="26" fill="#10233b">Where this differs from a typical career skill</text>
  <text x="40" y="76" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#68798c">Compared with common question-and-template career tools, not with a named product.</text>

  <rect x="24" y="96" width="1152" height="48" rx="8" fill="url(#head)"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    <text x="40" y="126">Dimension</text>
    <text x="220" y="126">Typical career skill</text>
    <text x="680" y="126">Career Strategist</text>
  </g>

  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="24" y="144" width="1152" height="92" fill="#ffffff"/>
    <rect x="24" y="236" width="1152" height="92" fill="#f4f8fb"/>
    <rect x="24" y="328" width="1152" height="92" fill="#ffffff"/>
    <rect x="24" y="420" width="1152" height="92" fill="#f4f8fb"/>
    <rect x="24" y="512" width="1152" height="92" fill="#ffffff"/>
    <rect x="24" y="604" width="1152" height="92" fill="#f4f8fb"/>
    <rect x="24" y="696" width="1152" height="92" fill="#ffffff"/>
    <rect x="24" y="788" width="1152" height="92" fill="#f4f8fb"/>
    <rect x="656" y="144" width="520" height="736" fill="#eaf6f1" opacity="0.55"/>
    <g stroke="#e2eaf2">
      <path d="M24 236H1176M24 328H1176M24 420H1176M24 512H1176M24 604H1176M24 696H1176M24 788H1176M24 880H1176"/>
    </g>
    <g stroke="#d7e0ea"><path d="M200 144V880M656 144V880"/></g>

    <g font-size="15" font-weight="700" fill="#10233b">
      <text x="40" y="196">Input</text>
      <text x="40" y="288">Market</text>
      <text x="40" y="380">Stance</text>
      <text x="40" y="472">Reasoning</text>
      <text x="40" y="564">Conclusion</text>
      <text x="40" y="656">New paths</text>
      <text x="40" y="748">Action</text>
      <text x="40" y="840">Delivery</text>
    </g>

    <g font-size="13.5" fill="#5b6b7d">
      <text x="216" y="182"><tspan fill="#b42318" font-weight="700">✕ </tspan>A short self-description, maybe a glance</text>
      <text x="216" y="204">at the resume. Conflicts and padding</text>
      <text x="216" y="226">in the materials go unchallenged.</text>

      <text x="216" y="274"><tspan fill="#b42318" font-weight="700">✕ </tspan>Trends and salaries from impression.</text>
      <text x="216" y="296">No date, no city, no source.</text>

      <text x="216" y="366"><tspan fill="#b42318" font-weight="700">✕ </tspan>If you want to switch, it argues for</text>
      <text x="216" y="388">the switch. If you want a startup,</text>
      <text x="216" y="410">it prices the dream.</text>

      <text x="216" y="458"><tspan fill="#b42318" font-weight="700">✕ </tspan>A conclusion and two sentences.</text>
      <text x="216" y="480">Ask it another way and the answer</text>
      <text x="216" y="502">may change.</text>

      <text x="216" y="550"><tspan fill="#b42318" font-weight="700">✕ </tspan>Five to ten directions, and the</text>
      <text x="216" y="572">choice is handed back to you.</text>

      <text x="216" y="642"><tspan fill="#b42318" font-weight="700">✕ </tspan>Interest and a success story are</text>
      <text x="216" y="664">treated as "you can do it too."</text>

      <text x="216" y="734"><tspan fill="#b42318" font-weight="700">✕ </tspan>"Learn more. Network more."</text>
      <text x="216" y="756">No deadline and no test.</text>

      <text x="216" y="826"><tspan fill="#b42318" font-weight="700">✕ </tspan>One chat reply. Facts, opinions,</text>
      <text x="216" y="848">and guesses are mixed together.</text>
    </g>

    <g font-size="13.5" fill="#22384f">
      <text x="676" y="182"><tspan fill="#087f6f" font-weight="700">✓ </tspan>Reads the resume, reviews, projects,</text>
      <text x="676" y="204">defense, and portfolio. Separates your</text>
      <text x="676" y="226">credit from the platform. Stops if a fact is missing.</text>

      <text x="676" y="274"><tspan fill="#087f6f" font-weight="700">✓ </tspan>Researches the cycle, real postings,</text>
      <text x="676" y="296">and the pay definition. Each number has</text>
      <text x="676" y="318">a date, a city, and a source.</text>

      <text x="676" y="366"><tspan fill="#087f6f" font-weight="700">✓ </tspan>Existing capital gets the defense.</text>
      <text x="676" y="388">A switch, a creator business, or a startup</text>
      <text x="676" y="410">must show evidence and an exit cost.</text>

      <text x="676" y="458"><tspan fill="#087f6f" font-weight="700">✓ </tspan>Fact, the other explanation, research,</text>
      <text x="676" y="480">the ledger, the call, and what evidence</text>
      <text x="676" y="502">would change it.</text>

      <text x="676" y="550"><tspan fill="#087f6f" font-weight="700">✓ </tspan>One recommended position, a ranking,</text>
      <text x="676" y="572">and a list of what not to do now.</text>

      <text x="676" y="642"><tspan fill="#087f6f" font-weight="700">✓ </tspan>A six-step evidence ladder plus the</text>
      <text x="676" y="664">business ledger. No payment, no side job.</text>

      <text x="676" y="734"><tspan fill="#087f6f" font-weight="700">✓ </tspan>14 / 30 / 60 / 90 days. Each block has</text>
      <text x="676" y="756">a deliverable, a pass signal, and a stop.</text>

      <text x="676" y="826"><tspan fill="#087f6f" font-weight="700">✓ </tspan>A fact dossier plus a long HTML report.</text>
      <text x="676" y="848">Facts and judgments are stored apart.</text>
    </g>
  </g>

  <rect x="24" y="908" width="1152" height="44" rx="8" fill="#0f2a4a"/>
  <text x="600" y="936" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Others offer a feeling of direction. This offers evidence, a ledger, one claim, and a 90-day test.</text>
</svg>
