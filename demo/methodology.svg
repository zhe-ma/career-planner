<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Career Strategist 工作方法：取证、调研、审判、定位、验证">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#123f3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f2a4a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="400" rx="18" fill="url(#bg)"/>
  <text x="48" y="58" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#ffffff">它不是“聊聊职业规划”，它按顾问办案的方式工作</text>
  <text x="48" y="88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b9cfe4">先把事实查清，再看市场，最后才允许下判断</text>

  <!-- steps -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- step template: x = 48, 276, 504, 732, 960 ; w=192 -->
    <g filter="url(#shadow)">
      <rect x="48" y="122" width="192" height="168" rx="12" fill="#ffffff"/>
      <rect x="276" y="122" width="192" height="168" rx="12" fill="#ffffff"/>
      <rect x="504" y="122" width="192" height="168" rx="12" fill="#ffffff"/>
      <rect x="732" y="122" width="192" height="168" rx="12" fill="#ffffff"/>
      <rect x="960" y="122" width="192" height="168" rx="12" fill="#fff7e8"/>
    </g>

    <circle cx="78" cy="152" r="15" fill="#0b5cad"/><text x="78" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
    <circle cx="306" cy="152" r="15" fill="#0b5cad"/><text x="306" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
    <circle cx="534" cy="152" r="15" fill="#0b5cad"/><text x="534" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
    <circle cx="762" cy="152" r="15" fill="#0b5cad"/><text x="762" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
    <circle cx="990" cy="152" r="15" fill="#b54708"/><text x="990" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>

    <text x="102" y="159" font-size="19" font-weight="800" fill="#10233b">材料取证</text>
    <text x="330" y="159" font-size="19" font-weight="800" fill="#10233b">市场调研</text>
    <text x="558" y="159" font-size="19" font-weight="800" fill="#10233b">独立审判</text>
    <text x="786" y="159" font-size="19" font-weight="800" fill="#10233b">唯一定位</text>
    <text x="1014" y="159" font-size="19" font-weight="800" fill="#10233b">90 天验证</text>

    <g font-size="13.5" fill="#43586e">
      <text x="66" y="196">简历 · 述职 · 项目</text>
      <text x="66" y="220">答辩 · 作品 · JD</text>
      <text x="66" y="252" fill="#0b5cad" font-weight="700">产出：事实档案</text>
      <text x="66" y="274">贡献 / 冲突 / 缺口分开</text>

      <text x="294" y="196">行业周期 · 岗位样本</text>
      <text x="294" y="220">薪资口径 · AI 任务冲击</text>
      <text x="294" y="252" fill="#0b5cad" font-weight="700">产出：市场口径</text>
      <text x="294" y="274">日期 / 城市 / 来源可查</text>

      <text x="522" y="196">留守 · 跳槽 · 换行</text>
      <text x="522" y="220">自媒体 · 创业 · 学习</text>
      <text x="522" y="252" fill="#0b5cad" font-weight="700">产出：逐个算账</text>
      <text x="522" y="274">机会成本 / 退出成本</text>

      <text x="750" y="196">不是罗列十个方向</text>
      <text x="750" y="220">七层能力架构定价</text>
      <text x="750" y="252" fill="#0b5cad" font-weight="700">产出：一个主张</text>
      <text x="750" y="274">排序 / 不去清单 / 改口条件</text>

      <text x="978" y="196">面试 · 项目 · 付费反馈</text>
      <text x="978" y="220">14 / 30 / 60 / 90 天</text>
      <text x="978" y="252" fill="#b54708" font-weight="700">产出：真实回音</text>
      <text x="978" y="274">达标推进，不达标改口</text>
    </g>

    <!-- arrows -->
    <g fill="#7dd3fc" font-size="22" font-weight="800">
      <text x="246" y="214">→</text>
      <text x="474" y="214">→</text>
      <text x="702" y="214">→</text>
      <text x="930" y="214">→</text>
    </g>
  </g>

  <rect x="48" y="318" width="1104" height="46" rx="8" fill="rgba(255,255,255,0.10)"/>
  <text x="600" y="347" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" font-weight="700" fill="#ffffff">核心原则：没有证据的鼓励不说 · 没有来源的数据不编 · 没有算账的建议不给</text>
</svg>
