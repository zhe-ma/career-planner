<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Career Strategist method: evidence, market, judgment, one position, a 90-day test">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#123f3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f2a4a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="18" fill="url(#bg)"/>
  <text x="48" y="52" font-family="Georgia,'Iowan Old Style',serif" font-size="26" font-weight="700" fill="#ffffff">It works like a case file, not a career chat.</text>
  <text x="48" y="82" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#b9cfe4">Facts first, then the market, and only then a judgment.</text>

  <g font-family="Helvetica,Arial,sans-serif">
    <g filter="url(#shadow)">
      <rect x="36" y="112" width="210" height="196" rx="12" fill="#ffffff"/>
      <rect x="262" y="112" width="210" height="196" rx="12" fill="#ffffff"/>
      <rect x="488" y="112" width="210" height="196" rx="12" fill="#ffffff"/>
      <rect x="714" y="112" width="210" height="196" rx="12" fill="#ffffff"/>
      <rect x="940" y="112" width="224" height="196" rx="12" fill="#fff7e8"/>
    </g>

    <circle cx="62" cy="146" r="15" fill="#0b5cad"/><text x="62" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <circle cx="288" cy="146" r="15" fill="#0b5cad"/><text x="288" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
    <circle cx="514" cy="146" r="15" fill="#0b5cad"/><text x="514" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <circle cx="740" cy="146" r="15" fill="#0b5cad"/><text x="740" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
    <circle cx="966" cy="146" r="15" fill="#b54708"/><text x="966" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>

    <text x="84" y="151" font-size="16" font-weight="700" fill="#10233b">Evidence</text>
    <text x="310" y="151" font-size="16" font-weight="700" fill="#10233b">Market</text>
    <text x="536" y="151" font-size="16" font-weight="700" fill="#10233b">Judgment</text>
    <text x="762" y="151" font-size="16" font-weight="700" fill="#10233b">One position</text>
    <text x="988" y="151" font-size="16" font-weight="700" fill="#10233b">90-day test</text>

    <g font-size="13" fill="#43586e">
      <text x="52" y="186">Resume, reviews, projects</text>
      <text x="52" y="208">Portfolio and target jobs</text>
      <text x="52" y="242" fill="#0b5cad" font-weight="700">Output: a fact dossier</text>
      <text x="52" y="264">Credit, conflicts, gaps</text>

      <text x="278" y="186">Cycle, real postings</text>
      <text x="278" y="208">Pay mix and AI on tasks</text>
      <text x="278" y="242" fill="#0b5cad" font-weight="700">Output: market facts</text>
      <text x="278" y="264">Date, city, and source</text>

      <text x="504" y="186">Stay, move, or switch</text>
      <text x="504" y="208">Creator, startup, study</text>
      <text x="504" y="242" fill="#0b5cad" font-weight="700">Output: the ledger</text>
      <text x="504" y="264">Opportunity and exit cost</text>

      <text x="730" y="186">Not a menu of ten paths</text>
      <text x="730" y="208">A seven-layer price</text>
      <text x="730" y="242" fill="#0b5cad" font-weight="700">Output: one claim</text>
      <text x="730" y="264">Rank, avoid, reversal</text>

      <text x="956" y="186">Interviews, work, payment</text>
      <text x="956" y="208">14 / 30 / 60 / 90 days</text>
      <text x="956" y="242" fill="#b54708" font-weight="700">Output: real feedback</text>
      <text x="956" y="264">Advance, or change the call</text>
    </g>

    <g fill="#7dd3fc" font-size="22" font-weight="700">
      <text x="248" y="214">→</text>
      <text x="474" y="214">→</text>
      <text x="700" y="214">→</text>
      <text x="926" y="214">→</text>
    </g>
  </g>

  <rect x="36" y="332" width="1128" height="52" rx="8" fill="rgba(255,255,255,0.10)"/>
  <text x="600" y="364" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">No encouragement without evidence. No number without a source. No advice without a ledger.</text>
</svg>
